[mgr]
ratio = [0,3,5]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = true
linemode = "none"
show_hidden = true
show_symlink = true
scrolloff = 200
mouse_events = ["click", "scroll", "touch", "move", "drag"]

[preview]
wrap = "yes"
tab_size = 2

[opener]
play = [
    { run = "mpv %s", orphan = true, for = "unix" },
    { run = '"C:\Program Files\mpv.exe" %s', orphan = true, for = "windows" }
]
edit = [
    { run = "nvim %s", block = true, for = "unix" },
    { run = "nvim %s", block = true, for = "windows" },
]
open = [
    { run = "xdg-open %s1", desc = "Open" },
    { run = 'start "" %s1', desc = "Open", for = "windows", orphan = true },
]

[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { url = "*.json", use = "edit" },
    { url = "*.html", use = "edit"},
    { mime = "video/*", use = "play" },
    { url = "*", use = "edit" },
]

[input]
cursor_blink = true

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "local://*"
run   = "mime-ext.local"
prio  = "high"
group = "mime"

[[plugin.prepend_fetchers]]
url   = "remote://*"
run   = "mime-ext.remote"
prio  = "high"
group = "mime"